<div class="stats-row" id="stats-cards">
    <div class="stat-card">
        <div class="stat-icon free"><i class="fas fa-square-parking"></i></div>
        <div class="stat-info">
            <span class="stat-value" id="stat-free">--</span>
            <span class="stat-label">Free Spaces</span>
        </div>
    </div>
    <div class="stat-card">
        <div class="stat-icon occupied"><i class="fas fa-car-side"></i></div>
        <div class="stat-info">
            <span class="stat-value" id="stat-occupied">--</span>
            <span class="stat-label">Occupied</span>
        </div>
    </div>
    <div class="stat-card">
        <div class="stat-icon total"><i class="fas fa-layer-group"></i></div>
        <div class="stat-info">
            <span class="stat-value" id="stat-total">--</span>
            <span class="stat-label">Total Spaces</span>
        </div>
    </div>
    <div class="stat-card">
        <div class="stat-icon rate"><i class="fas fa-gauge-high"></i></div>
        <div class="stat-info">
            <span class="stat-value" id="stat-rate">--<small>%</small></span>
            <span class="stat-label">Occupancy</span>
        </div>
    </div>
</div>
